ancient_altar-base:
  Type: ARMOR_STAND
  Display: 'Ancient Altar Base'
  Faction: Structures
  Health: 20
  Damage: 0
  Options:
    Despawn: persistent
    AlwaysShowName: true
    Invisible: false
    Silent: true
    Invincible: true
    DigOutOfGround: true
    NoAI: true
    NoGravity: true
  Variables:
    debug: true
    varient: "stone"
    material: "stone"
    color: "#FFFFFF"
  Skills:
  - skill{s=ancient_altar-init} @self ~onSpawn
  - skill{s=ancient_altar-init} @self ~onLoad 
  - skill{s=[
     - skill{s=ancient_altar-configure} ?~crouching
     - skill{s=ancient_altar-pairing}
    ]} @trigger ~onInteract
  - teleport @spawnlocation ~onTimer:10

ancient_portal-base:
  Type: ARMOR_STAND
  Display: 'Ancient Portal Base'
  Faction: Portals
  Health: 20
  Damage: 0
  Options:
    Despawn: persistent
    AlwaysShowName: true
    Invisible: false
    Silent: true
    Invincible: true
    DigOutOfGround: true
    NoAI: true
    NoGravity: true
  Variables:
    executecommand: broadcast no command set.
    debug: true
    close_upon_entry: true
    close_when_inactive: true
    only_keyuser_canenter: true
    varient: "stone"
    material: "stone"
    color: "#FFFFFF"
  Skills:
  - skill{s=ancient_portal-init} @self ~onSpawn 
  - skill{s=ancient_portal-init} @self ~onLoad
  - skill{s=ancient_portal-configure} @trigger ~onInteract
  - skill{s=ancient_portal-tick} @self ~onTimer:10
  - skill{s=ancient_portal-activate} @self ~onSignal:activate
  - skill{s=ancient_portal-deactivate} @self ~onSignal:deactivate

