#FIRST PAGE AND CLOSE ONE

lemon_class_selection_open:
  Cooldown: 1
  Conditions:
  - variableEquals{var=caster.key;value="3"} orElseCast lemon_class_selection_sound_fail
  Skills:
  - command{c="goop nbt cModelData <target.name> c<EYE> 2"} @Self
  - sound{s=entity.wither.hurt;v=0.2;p=2} @Self
  - sound{s=entity.endermite.death;v=1;p=2;delay=4} @Self
  - delay 24
  - setvariable{var=caster.key;value="1";type=INTEGER} @self
  - command{c="goop containers open lemon_class_selection_character_1 <target.name>"} @Self
  - sound{s=block.enchantment_table.use;v=0.4;p=1} @Self
  - sound{s=entity.ender_eye.death;v=1;p=1} @Self
  - delay 2
  - command{c="goop nbt cModelData <target.name> c<BOOK> 71"} @Self
  - delay 3
  - command{c="goop nbt cModelData <target.name> c<BOOK> +1";repeat=6;repeatinterval=3} @Self
  - sound{s=item.book.page_turn;v=1;p=1} @Self
  - delay 24
  - command{c="goop nbt cModelData <target.name> c<BOOK> 2"} @Self
  - command{c="goop nbt cModelData <target.name> c<HEAD> 89"} @Self
lemon_class_selection_close:
  Cooldown: 1
  Skills:
  - command{c="goop containers open lemon_class_selection_close <target.name>"} @Self
  - sound{s=item.book.put;v=2;p=0.6} @Self

